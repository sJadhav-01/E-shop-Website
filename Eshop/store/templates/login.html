{% extends 'base.html' %} {% block content %}

<div class="container">
  <div class="p-6 m-4">
    <div class="col-lg-5 mx-auto border rounded p-4 m-3">
      <form action="/login" method="POST">
        {% csrf_token %}
        <h3 class="alert alret-light border rounded">Login here</h3>
        {% if error %}
        <h5 class="alert alert-danger">{{ error }}</h5>
        {% endif %}

        <!-- email -->
        <div class="form-group p-1">
          <label for="">Email</label>
          <input
            type="email"
            name="email"
            id=""
            class="form-control form-control-sm"
            placeholder="example@gmail.com"
            value="{{ values.em }}"
          />
        </div>

        <!-- password -->
        <div class="form-group p-1">
          <label for="">Password</label>
          <input
            type="password"
            name="password"
            id=""
            class="form-control form-control-sm"
            placeholder="***********"
          />
        </div>
        <!-- button -->

        <div class="form-group p-1 ">
          <input
            type="submit"
            value="Login"
            class="btn btn-sm btn-info col-lg-4"
          />
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
